repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.oms\.sig$'
      - id: end-of-file-fixer
        exclude: '\.oms\.sig$'
      - id: check-yaml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.1
    hooks:
      #- id: ruff-check
      #  args: [ --fix ]
      - id: ruff-format
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv.lock is in sync with pyproject.toml
        # Fails on a missing lockfile (exit 2) and on any pyproject/lock
        # inconsistency (exit 1), so a stale lock cannot merge even though
        # CI runs `uv sync` without `--locked`.
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
        stages: [pre-commit]
