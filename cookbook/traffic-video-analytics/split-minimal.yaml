# =============================================================================
# Smart City Traffic -- Split + CE1 + captions (overrides only)
# =============================================================================
# Split both shipped intersection clips, write Qwen3-VL captions, and emit
# Cosmos-Embed1 embeddings. No classifier, SAM3, caption enhance, or
# super-resolution. Full kitchen-sink recipe: split.yaml in this directory.
#
# Input: DATA_DIR/videos (SDG-Intersection-01.mp4 and SDG-Intersection-02.mp4).
#
# All omitted keys fall back to parser defaults.
# See configs/split.yaml for the full reference.
# =============================================================================

pipeline: "split"

# -- I/O (under DATA_DIR, mounted at /data) --
input_video_path: /data/videos
output_clip_path: /data/output/split-minimal
model_weights_path: "/config/models"

# -- Splitting: 10 s stride on the shipped ~89 s / ~130 s clips --
splitting_algorithm: "fixed-stride"
fixed_stride_split_duration: 10
fixed_stride_min_clip_length_s: 2.0

# -- Captioning: Qwen3-VL-30B FP8 (in-process weights under MODELS_DIR) --
generate_captions: true
captioning_algorithm: "qwen3_vl_30b_fp8"
captioning_prompt_variant: "default"
captioning_window_size: 60
captioning_sampling_fps: 2.0
captioning_max_output_tokens: 4096
vllm_sampling_temperature: 0.1
vllm_sampling_top_p: 0.001
vllm_sampling_repetition_penalty: 1.05

# -- Skip kitchen-sink stages --
enhance_captions: false
video_classifier: false
motion_filter: "disable"
aesthetic_threshold: null
vlm_filter: "disable"
# Curator treats this option as a boolean flag; string "disable" is truthy.
artificial_text_filter: false
sam3: false
event_captioning: false
super_resolution: false

# -- Embedding (Path C / Path D handoff producer) --
generate_embeddings: true
embedding_algorithm: "cosmos-embed1-224p"
embedding_batch_size: 4

upload_clips: true
write_all_caption_json: true
perf_profile: false
