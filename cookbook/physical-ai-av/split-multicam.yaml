# =============================================================================
# PhysicalAI-AV -- Multi-cam split + captions + classifier + SAM3 (overrides)
# =============================================================================
# Full recipe for session folders produced by:
#   python -m adapters.physical_ai_av.prepare_sessions --output-dir <DATA_DIR>
#
# Input layout (required by Curator --multi-cam):
#   DATA_DIR/videos/<clip-uuid>/camera_front_wide_120fov.mp4
#   DATA_DIR/videos/<clip-uuid>/camera_front_tele_30fov.mp4
#   DATA_DIR/videos/<clip-uuid>/camera_cross_left_120fov.mp4
#   DATA_DIR/videos/<clip-uuid>/camera_cross_right_120fov.mp4
#
# Multi-cam is fixed-stride only. Caption / classifier / SAM3 / embed stages
# use the primary camera (path contains primary_camera_keyword). Do not use
# "front" here -- it matches both front_wide and front_tele.
#
# Needs VLM/LLM endpoints or in-process 30B weights, plus PIXI_ENV=sam3.
# To check the setup without a VLM, run
# cookbook/traffic-video-analytics/split-minimal.yaml first.
# See configs/split.yaml for the full reference.
# =============================================================================

pipeline: "split"

# -- I/O (under DATA_DIR, mounted at /data) --
input_video_path: /data/videos
output_clip_path: /data/output/split-multicam
model_weights_path: "/config/models"

# -- Multi-cam session split --
multi_cam: true
primary_camera_keyword: "front_wide"
splitting_algorithm: "fixed-stride"
fixed_stride_split_duration: 10
fixed_stride_min_clip_length_s: 2.0

# -- Captioning: Qwen3-VL-30B FP8 (primary camera only) --
generate_captions: true
captioning_algorithm: "qwen3_vl_30b_fp8"
captioning_prompt_variant: "av"
captioning_window_size: 60
captioning_sampling_fps: 2.0
captioning_max_output_tokens: 4096
vllm_sampling_temperature: 0.1
vllm_sampling_top_p: 0.001
vllm_sampling_repetition_penalty: 1.05

enhance_captions: true
enhance_captions_prompt_variant: "av"

# -- Motion filter: score-only (enriches metadata without dropping clips) --
motion_filter: "score-only"
aesthetic_threshold: null
vlm_filter: "disable"
artificial_text_filter: false
super_resolution: false

video_classifier: false

# -- SAM3 + track-grounded event captioning (primary camera only) --
# Prompts match taxonomy_av.yaml objects_of_interest (same order).
# Skip lane markings, generic "road", crosswalks, and speed-limit signs.
sam3: true
sam3_prompts:
  - "a car"
  - "a truck"
  - "a bus"
  - "a school bus"
  - "a van"
  - "a motorcycle"
  - "a trailer"
  - "a bicycle"
  - "a scooter"
  - "a pedestrian"
  - "a wheelchair"
  - "a stroller"
  - "a worker"
  - "a deer"
  - "a dog"
  - "a traffic light"
  - "a stop sign"
  - "a yield sign"
  - "a traffic cone"
  - "a construction barrel"
  - "a construction barrier"
  - "a jersey barrier"
  - "a bollard"
  - "a dumpster"
  - "an excavator"
  - "a police car"
  - "an ambulance"
  - "a fire truck"
  - "a speed bump"
  - "a railroad crossing gate"
  - "road debris"
sam3_target_fps: 3.0
sam3_max_clip_duration_s: 45.0
sam3_session_reset_s: 5.0
sam3_score_threshold_detection: 0.6
sam3_det_nms_thresh: 0.1
sam3_new_det_thresh: 0.8
sam3_fill_hole_area: 256
sam3_recondition_every_nth_frame: 8
sam3_recondition_on_trk_masks: true
sam3_high_conf_thresh: 0.5
sam3_high_iou_thresh: 0.4
sam3_region: box
sam3_output_format: native
sam3_write_annotated_video: true
sam3_annotated_video_trails: false
sam3_annotated_video_label_style: "id"
sam3_annotated_video_mask_opacity: 0

event_captioning: true
event_caption_backend: "qwen"
event_caption_qwen_variant: "qwen3_vl_30b_fp8"
event_caption_qwen_fp8: false
event_caption_qwen_sampling_fps: 2.0
event_caption_qwen_temperature: 0.0
event_caption_qwen_top_p: 1.0
# Copy av_event_caption_prompt.txt into DATA_DIR. It emits an events[]
# array with start_time and end_time on each event.
event_caption_prompt_file: /data/av_event_caption_prompt.txt
event_caption_prompt: null

# -- Embedding (Path D handoff producer; primary camera only) --
generate_embeddings: true
embedding_algorithm: "cosmos-embed1-224p"
embedding_batch_size: 4

upload_clips: true
write_all_caption_json: true
perf_profile: true
